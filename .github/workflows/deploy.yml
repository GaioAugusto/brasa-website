name: Deploy to Production

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              env:
                  VITE_AWS_COGNITO_USER_POOL_ID: ${{ vars.VITE_AWS_COGNITO_USER_POOL_ID }}
                  VITE_AWS_COGNITO_CLIENT_ID: ${{ vars.VITE_AWS_COGNITO_CLIENT_ID}}
                  VITE_USERS_API_BASE_URL: ${{ vars.VITE_USERS_API_BASE_URL }}
                  VITE_EVENTS_API_BASE_URL: ${{ vars.VITE_EVENTS_API_BASE_URL || vars.VITE_USERS_API_BASE_URL }}
              run: npm run build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-region: ${{ vars.AWS_REGION }}
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

            - name: Upload static files to S3
              run: |
                  aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }} --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
                    --paths "/*"
